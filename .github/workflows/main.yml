name: Claim Free Games

on:
  schedule:
    - cron: '0 18 * * 4'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Dependencies
        run: pip install requests pyotp
      - name: Run Claimer
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          EPIC_TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
        run: python epic-games.js

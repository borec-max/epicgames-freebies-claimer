name: Claim Free Games

on:
  schedule:
    - cron: '0 18 * * 4'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install
      - name: Create Config File
        run: |
          mkdir -p data
          echo '{
            "email": "${{secrets.EPIC_EMAIL}}",
            "password": "${{secrets.EPIC_PASSWORD}}",
            "totp": "${{secrets.EPIC_TOTP_SECRET}}",
            "appriseUrl": null,
            "delay": 1440,
            "loop": false,
            "notifyIfNoUnclaimedFreebies": false,
            "options": {}
          }' > data/config.json
      - name: Run Claimer
        run: node claimer.js
